<template>
    <lightning-button
        variant="brand"
        label={buttonLabel}
        onclick={handleOpenModal}
        disabled={isLoadingSummary}>
    </lightning-button>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close" title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium">Opportunity Products</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <template if:false={isPaying}>
                        <template if:true={summary}>
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col">Product</th>
                                        <th scope="col">Qty</th>
                                        <th scope="col">Unit Price</th>
                                        <th scope="col">Total</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={summary.lineItems} for:item="item" for:index="idx">
                                        <tr key={item.Id}>
                                            <td>{item.productName}</td>
                                            <td>{item.quantity}</td>
                                            <td>{item.unitPrice}</td>
                                            <td>{item.totalPrice}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                            <p class="slds-m-top_medium slds-text-heading_small">
                                Total due: {formattedTotal}
                            </p>
                        </template>

                        <template if:true={errorMessage}>
                            <div class="slds-text-color_error slds-m-top_small">{errorMessage}</div>
                        </template>
                    </template>

                    <template if:true={isPaying}>
                        <div class="checkout-container" lwc:dom="manual"></div>
                    </template>

                </div>

                <footer class="slds-modal__footer">
                    <template if:false={isPaying}>
                        <lightning-button label="Cancel" onclick={handleCloseModal}></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Pay Now"
                            class="slds-m-left_x-small"
                            onclick={handlePayNow}
                            disabled={isCreatingSession}>
                        </lightning-button>
                    </template>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
